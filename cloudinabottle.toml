[app]
name = "oura"
version = "1.0.0"
description = "Health data aggregator - syncs wearable data and exposes a generic health API"

[runtime.container]
image = "Dockerfile"
# Cloud in a Bottle pulls this signed prebuilt image (built from the release tag's commit by CI) instead of building
# `image`. If you fork this app and change it, comment this line out so your instance builds `image` instead.
prebuilt_image = "registry.cloudinabottle.org/oura-connector"
port = 8080

[routing]
health_check = "/health"

[resources]
# The image build peaks ~410 MB (uv sync), and a history backfill pulls +
# stores a lot of data, so 256 MB was tight (idle already ~90 MB). 512 MB
# covers the build and leaves runtime headroom.
memory_mb = 512
cpu_cores = 0.2

[data]
sqlite = ["health"]

# Read other providers' workouts so overlapping Oura ones can be hidden as
# duplicates (opt-in, see Setup).
[[services.v2.consumes]]
service = "https://github.com/imbue-openhost/health-data-service-spec"
shortname = "health"
version = ">=0.1.0"
grants = ["read"]

[[services.v2.provides]]
service = "https://github.com/imbue-openhost/health-data-service-spec"
version = "0.1.0"
endpoint = "/api/"
